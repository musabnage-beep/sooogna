  <!-- Boot intro overlay (Remotion-rendered Sudan onboarding) -->
  <style>
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: #0A0A0A;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 450ms ease;
    }
    #intro-overlay.hide { opacity: 0; pointer-events: none; }
    #intro-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="intro-overlay">
    <video id="intro-video" autoplay muted playsinline preload="auto">
      <source src="sudan_intro.mp4" type="video/mp4">
    </video>
  </div>
  <script>
    (function () {
      var overlay = document.getElementById('intro-overlay');
      var video = document.getElementById('intro-video');
      if (!overlay) return;
      var videoEnded = false;
      var firstFrame = false;
      var done = false;

      function hide() {
        if (done) return;
        // Only dismiss once the intro has played out AND Flutter has painted,
        // so the app is never seen mid-boot. Hard timeout is a safety net.
        if (!(videoEnded && firstFrame)) return;
        done = true;
        overlay.classList.add('hide');
        setTimeout(function () {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 500);
      }

      if (video) {
        video.addEventListener('ended', function () { videoEnded = true; hide(); });
        // If autoplay is blocked or the file is missing, don't trap the user.
        video.addEventListener('error', function () { videoEnded = true; firstFrame = true; hide(); });
        var p = video.play();
        if (p && p.catch) { p.catch(function () { videoEnded = true; hide(); }); }
      } else {
        videoEnded = true;
      }

      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        hide();
      });

      // Safety net: never keep the overlay longer than 5s.
      setTimeout(function () { videoEnded = true; firstFrame = true; hide(); }, 5000);
    })();
  </script>
