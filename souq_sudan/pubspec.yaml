name: souq_sudan
description: سوق السودان - منصة إعلانات مبوبة للسوق السوداني
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_app_check: ^0.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.3.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  timeago: ^3.7.0

  # Image handling
  image_picker: ^1.1.2
  image: ^4.2.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0
  google_fonts: ^6.2.1
  uuid: ^4.4.2

  # Web platform interop (per-route SEO/social meta injection)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Pin path_provider_foundation below the version that pulls in `objective_c`,
# which requires the experimental Dart "native assets" feature and breaks the
# web build. path_provider_foundation is Apple-only and unused on web.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
